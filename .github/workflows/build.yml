name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Install dependencies
      working-directory: flutter_app
      run: flutter pub get
    
    - name: Analyze code
      working-directory: flutter_app
      run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | head -50
    
    - name: Build APK
      working-directory: flutter_app
      run: |
        flutter build apk --debug 2>&1 | tail -50
        echo "=== APK 文件检查 ==="
        ls -la build/app/outputs/apk/debug/ 2>/dev/null || echo "APK 目录不存在"
        echo "=== 找到的 APK 文件 ==="
        find . -name "*.apk" -type f 2>/dev/null
        echo "=== 当前目录 ==="
        pwd
    
    - name: Upload APK
      if: success()
      working-directory: flutter_app
      uses: actions/upload-artifact@v4
      with:
        name: fund-quant-apk
        path: build/app/outputs/apk/debug/app-debug.apk
        retention-days: 1
        if-no-files-found: error
    
    - name: Release
      if: false && success() && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        files: flutter_app/build/app/outputs/apk/debug/app-debug.apk
        tag_name: ${{ github.run_number }}
        name: Build ${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
