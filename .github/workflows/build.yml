name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: flutter_app
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Analyze code
      run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | head -50
    
    - name: Build APK
      run: flutter build apk --debug 2>&1 | tail -50
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fund-quant-apk
        path: build/app/outputs/apk/debug/app-debug.apk
    
    - name: Release
      if: false && success() && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        files: flutter_app/build/app/outputs/apk/debug/app-debug.apk
        tag_name: ${{ github.run_number }}
        name: Build ${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
