name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Install dependencies
      working-directory: ${{ github.workspace }}/flutter_app
      run: flutter pub get
    
    - name: Analyze code
      working-directory: ${{ github.workspace }}/flutter_app
      run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | head -50
    
    - name: Build APK
      working-directory: ${{ github.workspace }}/flutter_app
      run: |
        flutter build apk --debug 2>&1 | tail -50
        echo "=== 当前目录 ==="
        pwd
        echo "=== APK 文件检查 ==="
        ls -la build/app/outputs/apk/debug/ 2>/dev/null || echo "APK 目录不存在"
        echo "=== 找到的 APK ==="
        find . -name "app-debug.apk" -type f 2>/dev/null
    
    - name: Copy APK to workspace
      run: |
        cp ${{ github.workspace }}/flutter_app/build/app/outputs/apk/debug/app-debug.apk ${{ github.workspace }}/app-debug.apk
        ls -la ${{ github.workspace }}/app-debug.apk
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fund-quant-apk
        path: app-debug.apk
        retention-days: 1
